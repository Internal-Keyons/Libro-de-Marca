<style>
  body{margin:0;background:var(--k-blanco);color:var(--color-text);font:400 16px/1.6 var(--font-sans)}
  .dv{max-width:760px;margin:0 auto;padding:var(--s16) var(--s6) var(--s24)}
  .dv__bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s4);padding-bottom:var(--s6);border-bottom:1.5px solid var(--color-border)}
  .dv__bar a,.dv__bar button{font:500 14px/1 var(--font-sans);color:var(--k-noche);text-decoration:none;background:none;border:1.5px solid var(--k-cielo);border-radius:var(--r-pill);padding:10px 18px;cursor:pointer}
  .dv__bar a:hover,.dv__bar button:hover{background:var(--k-cielo-100)}
  .dv__cover{padding:var(--s24) 0 var(--s16)}
  .dv__cover h1{font:500 clamp(44px,8vw,80px)/1 var(--font-display);letter-spacing:-.03em;margin:0 0 var(--s6)}
  .dv__cover p{margin:0;color:var(--color-text-2)}
  .dv__toc{padding:var(--s8) 0;border-top:1.5px solid var(--color-border)}
  .dv__toc ol{margin:var(--s4) 0 0;padding-left:var(--s6);columns:2;column-gap:var(--s10)}
  .dv__toc a{color:var(--k-noche)}
  h1,h2,h3,h4,h5,h6{font-family:var(--font-display);font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:var(--s12) 0 var(--s3)}
  main h1{font-size:44px}
  h2{font-size:36px;padding-top:var(--s16);border-top:1.5px solid var(--k-noche)}
  h3{font-size:28px;margin-top:var(--s16)}
  h4{font-size:22px}
  h5{font-size:18px;font-family:var(--font-sans);font-weight:600;letter-spacing:0}
  h6{font-size:16px;font-family:var(--font-sans);font-weight:600;letter-spacing:0}
  p,ul,ol{margin:0 0 var(--s3)}
  .lines{padding-left:var(--s4);border-left:1.5px solid var(--color-border)}
  .meta{font-size:13px;color:var(--color-text-3)}
  .res{font-size:13px;color:var(--color-text-3);padding:var(--s2) var(--s3);background:var(--k-puro);border-left:3px solid var(--k-cielo)}
  table{width:100%;border-collapse:collapse;margin:var(--s4) 0;font-size:14px}
  th,td{text-align:left;vertical-align:top;padding:var(--s2) var(--s3);border-bottom:1px solid var(--color-border)}
  th{font-weight:600}
  code{font:13px var(--font-mono)}
  a{color:var(--k-noche);text-decoration-color:var(--k-cielo);text-underline-offset:3px}
  @media(max-width:640px){.dv__toc ol{columns:1}h2{font-size:28px}h3{font-size:23px}}
  @media print{
    @page{size:A4;margin:18mm 16mm}
    body{background:#fff;font-size:11pt}
    .dv{max-width:none;padding:0}
    .dv__bar{display:none}
    .dv__cover{padding-top:60mm;break-after:page}
    .dv__toc{break-after:page}
    h2{break-before:page;border-top:0;padding-top:0}
    h1,h2,h3,h4,h5,h6{break-after:avoid}
    table,.lines,.res{break-inside:avoid}
    a{text-decoration:none}
  }
</style>
