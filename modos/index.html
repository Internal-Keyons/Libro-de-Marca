      <div>
        <h2 class="ed__title">La identidad permanece. La intensidad cambia.</h2>
        <p class="ed__lead">Keyons tiene una sola identidad visual. Su expresión cambia según lo que necesita comunicar, las personas a quienes se dirige y el entorno en el que aparece.</p>
        <div class="prosa"><p>Una propuesta institucional puede ser sobria y precisa. Una publicación editorial puede combinar fotografía, color y composiciones inesperadas. Una campaña puede llevar esa libertad todavía más lejos. Las tres pertenecen a la misma marca.</p><p>La diferencia no está en utilizar sistemas visuales separados, sino en regular la intensidad con la que se manifiestan sus recursos.</p></div>
        <div class="pgrid pgrid--2"><div><span class="pgrid__n">01</span><p class="pgrid__t">Lo que permanece</p><p class="pgrid__d">La tipografía, el sistema cromático, la geometría, los criterios de composición y los principios de claridad constituyen una base compartida. Su aplicación puede variar, pero debe conservar una relación reconocible con la identidad Keyons.</p><p class="pgrid__d">La coherencia no exige repetir una misma distribución, un mismo degradado o una misma cantidad de color. Se construye mediante decisiones que responden a una gramática visual común.</p></div><div><span class="pgrid__n">02</span><p class="pgrid__t">Lo que varía</p><p class="pgrid__d">Pueden cambiar el protagonismo de la fotografía, la intensidad cromática, la escala tipográfica, el ritmo, la presencia de texturas, el movimiento y la libertad de composición.</p><p class="pgrid__d">Estas variaciones responden al propósito de cada pieza. No se utilizan recursos expresivos para demostrar creatividad, sino porque ayudan a comunicar una idea, construir una atmósfera o generar una experiencia memorable.</p></div></div>
        <h3 class="ed__sub">Un continuo de expresión</h3>
        <p class="ed__lead">Formal, Corporativo Editorial y Expresivo son tres referencias dentro de un mismo continuo.</p>
        <div class="espectro" role="img" aria-label="Espectro continuo de intensidad: Formal, Corporativo Editorial y Expresivo"><span class="espectro__barra" aria-hidden="true"></span><span class="espectro__k">Formal</span><span class="espectro__k">Corporativo Editorial</span><span class="espectro__k">Expresivo</span></div>
        <div class="prosa"><p>No constituyen estilos cerrados ni categorías excluyentes. Una pieza puede situarse entre dos niveles, adoptar características de ambos o modificar su intensidad entre secciones.</p><p>La elección depende de cuatro preguntas: qué se comunica, a quién se dirige, dónde aparecerá y cuánta libertad visual permite su función.</p></div>
        <h3 class="ed__sub">Estructura y expresión</h3>
        <div class="prosa"><p>Keyons combina la disciplina de una estructura clara con la libertad de una expresión visual propia.</p><p>La relación 60/40 puede utilizarse como metáfora de ese equilibrio: una base estructural suficientemente sólida para sostener una capa expresiva con personalidad.</p><p>No representa una proporción técnica ni obliga a distribuir una composición mediante porcentajes.</p><p>El minimalismo y el maximalismo no son identidades opuestas. Son recursos que pueden convivir dentro de una misma pieza. Una fotografía intensa puede ocupar una composición extremadamente sencilla; una página casi monocromática puede conseguir gran expresividad mediante escala, ritmo y espacio.</p></div>
        <div class="ed__close"><p>La intensidad no se mide por la cantidad de elementos, sino por la fuerza y la pertinencia de las decisiones visuales.</p></div>
      </div>
